# Merge into prometheus.yml only when the API metrics token and secret mount exist.
# Scrape each API process separately; a load-balanced address cannot aggregate
# per-process counters correctly. The current Compose API uses one process.
scrape_configs:
  - job_name: vindex-library-search
    metrics_path: /internal/search-metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/search_metrics_token
    static_configs:
      - targets: ['api:8000']
