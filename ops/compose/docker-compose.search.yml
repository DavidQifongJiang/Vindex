# Isolated local experiment: docker compose -f ops/compose/docker-compose.search.yml up -d
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports: ['127.0.0.1:9200:9200']
    mem_limit: 2g
    volumes: ['search_experiment_data:/usr/share/elasticsearch/data']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s']
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  search_experiment_data:
