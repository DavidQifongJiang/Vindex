# Isolated development transport. Workers run using the project virtualenv.
services:
  kafka-volume-init:
    image: apache/kafka:4.1.1
    user: '0'
    entrypoint: ['/bin/chown']
    command: ['1000:1000', '/tmp/kraft-combined-logs']
    volumes: ['analytics_kafka_data:/tmp/kraft-combined-logs']
  postgres:
    image: postgres:16-alpine
    ports: ['127.0.0.1:15434:5432']
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: local_analytics_only
      POSTGRES_DB: analytics
    volumes: ['analytics_postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U analytics -d analytics']
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.1.1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports: ['127.0.0.1:19092:19092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
    volumes: ['analytics_kafka_data:/tmp/kraft-combined-logs']
    mem_limit: 1g
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  analytics_kafka_data:
  analytics_postgres_data:
