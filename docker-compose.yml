services:
  api:
    build:
      context: .
      args:
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN:-}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-}
        VITE_COGNITO_REDIRECT_URI: ${VITE_COGNITO_REDIRECT_URI:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      context: .
      args:
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN:-}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID:-}
        VITE_COGNITO_REDIRECT_URI: ${VITE_COGNITO_REDIRECT_URI:-}
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --pool=solo
    restart: unless-stopped
    stop_grace_period: 2m
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-vindex}
      POSTGRES_PASSWORD: ${PGPASSWORD:-vindex}
      POSTGRES_DB: ${PGDATABASE:-vindex}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-vindex} -d ${PGDATABASE:-vindex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  postgres_data:
  qdrant_data:
