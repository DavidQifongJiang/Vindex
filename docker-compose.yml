services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - qdrant

  worker:
    build: .
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --pool=solo
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - qdrant

  redis:
    image: redis:7

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vindex
      POSTGRES_PASSWORD: vindex
      POSTGRES_DB: vindex
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: