services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env.example

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vindex
      POSTGRES_PASSWORD: vindex
      POSTGRES_DB: vindex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: