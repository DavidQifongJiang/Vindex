<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img"><title>Vindex 03-processing-dag</title><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#315B82"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#118C97"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="360" y="180" width="1030" height="250" rx="18" fill="#F7FBFD" stroke="#38B3CD" stroke-width="1.7" stroke-dasharray="8 7"/><text x="382" y="211" text-anchor="start" font-size="18" font-weight="650" fill="#19334A">PLAYBACK JOB  ·  one task; the steps below remain sequential</text><rect x="360" y="495" width="1030" height="390" rx="18" fill="#F7FBFD" stroke="#38B3CD" stroke-width="1.7" stroke-dasharray="8 7"/><text x="382" y="526" text-anchor="start" font-size="18" font-weight="650" fill="#19334A">SEARCH BRANCH  ·  prepare → chunk jobs → finalize</text><polyline points="275,480 320,480 320,305 395,305" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="320,480 320,685 395,685" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="625,305 675,305" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="945,305 995,305" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="1355,305 1450,305" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="625,685 655,685 655,585 685,585" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="655,685 685,685" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="655,685 655,785 685,785" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="955,585 985,585 985,685 1035,685" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="955,685 985,685" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="955,785 985,785 985,685" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="1355,685 1450,685" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="1575,735 1575,935" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="1700,305 1740,305 1740,980 1700,980" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><rect x="55" y="420" width="220" height="120" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="165.0" y="464.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Accepted raw video</text><text x="165.0" y="491.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Frozen S3 input</text><text x="165.0" y="515.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Two durable initial jobs</text><rect x="395" y="260" width="230" height="90" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="510.0" y="301.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">FFmpeg transcode</text><text x="510.0" y="328.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">360p MP4</text><rect x="675" y="260" width="270" height="90" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="810.0" y="301.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Generate thumbnail</text><text x="810.0" y="328.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Generation is best effort</text><rect x="995" y="260" width="360" height="90" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="1175.0" y="301.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Publish playback</text><text x="1175.0" y="328.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">S3 objects + guarded DB pointers</text><rect x="1450" y="260" width="250" height="90" rx="12" fill="#ECF9F7" stroke="#118C97" stroke-width="2.2"/><text x="1575.0" y="301.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Playable</text><text x="1575.0" y="328.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Signed S3 media URL</text><rect x="395" y="630" width="230" height="110" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="510.0" y="669.0" text-anchor="middle" font-size="21" font-weight="650" fill="#19334A">Prepare search</text><text x="510.0" y="696.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Probe duration, extract audio</text><text x="510.0" y="720.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Commit chunk manifest</text><rect x="685" y="540" width="270" height="90" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="820.0" y="569.0" text-anchor="middle" font-size="20" font-weight="650" fill="#19334A">Chunk 1</text><text x="820.0" y="596.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Whisper → embeddings</text><text x="820.0" y="620.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Qdrant + S3; guarded commit</text><rect x="685" y="640" width="270" height="90" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="820.0" y="669.0" text-anchor="middle" font-size="20" font-weight="650" fill="#19334A">Chunk 2</text><text x="820.0" y="696.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Whisper → embeddings</text><text x="820.0" y="720.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Qdrant + S3; guarded commit</text><rect x="685" y="740" width="270" height="90" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="820.0" y="769.0" text-anchor="middle" font-size="20" font-weight="650" fill="#19334A">Chunk N</text><text x="820.0" y="796.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Whisper → embeddings</text><text x="820.0" y="820.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Qdrant + S3; guarded commit</text><rect x="1035" y="630" width="320" height="110" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="1195.0" y="669.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Finalize search</text><text x="1195.0" y="696.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Wait for all chunks</text><text x="1195.0" y="720.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Merge final artifacts + DB state</text><rect x="1450" y="640" width="250" height="95" rx="12" fill="#ECF9F7" stroke="#118C97" stroke-width="2.2"/><text x="1575.0" y="683.5" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Searchable</text><text x="1575.0" y="710.5" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">API queries Qdrant</text><rect x="1450" y="935" width="250" height="90" rx="12" fill="#F1F5F8" stroke="#19334A" stroke-width="2.2"/><text x="1575.0" y="976.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Video: processed</text><text x="1575.0" y="1003.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Both milestones complete</text><text x="55" y="48" text-anchor="start" font-size="15" font-weight="700" fill="#38B3CD">VINDEX  /  03  PROCESSING DAG</text><text x="55" y="91" text-anchor="start" font-size="34" font-weight="700" fill="#19334A">One accepted video → independent playback and search</text><text x="55" y="124" text-anchor="start" font-size="18" font-weight="400" fill="#51687A">Only true dependencies are ordered. Worker capacity determines how much of the available fan-out runs at once.</text><rect x="417.2" y="768" width="185.60000000000002" height="24" rx="4" fill="white"/><text x="510" y="784" text-anchor="middle" font-size="16" font-weight="400" fill="#51687A">Default: 300s chunks</text><rect x="425.68" y="794" width="168.64000000000001" height="24" rx="4" fill="white"/><text x="510" y="810" text-anchor="middle" font-size="16" font-weight="400" fill="#51687A">5s context overlap</text><text x="395" y="400" text-anchor="start" font-size="19" font-weight="650" fill="#118C97">Playback does not wait for transcription.</text><text x="395" y="857" text-anchor="start" font-size="18" font-weight="400" fill="#51687A">Each chunk does ASR → embeddings → publication; chunks can run independently.</text><text x="55" y="962" text-anchor="start" font-size="22" font-weight="650" fill="#19334A">Two readiness milestones</text><text x="55" y="994" text-anchor="start" font-size="19" font-weight="400" fill="#51687A">Search and playback can become usable at different times.</text><path d="M55 1030 H1745" stroke="#D7E6EC"/><text x="55" y="1058" text-anchor="start" font-size="17" font-weight="400" fill="#51687A">Current search API waits for finalization; one published chunk alone does not enable video search.</text><text x="55" y="1083" text-anchor="start" font-size="17" font-weight="400" fill="#51687A">No watermark task, adaptive-bitrate ladder, or separate audio/video assembly stage is implemented in this core path.</text></g></svg>
