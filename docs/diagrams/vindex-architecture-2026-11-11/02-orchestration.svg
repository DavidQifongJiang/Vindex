<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="970" viewBox="0 0 1800 970" role="img"><title>Vindex 02-orchestration</title><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#315B82"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#118C97"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="335" y="610" width="780" height="180" rx="18" fill="#F7FBFD" stroke="#38B3CD" stroke-width="1.7" stroke-dasharray="8 7"/><text x="357" y="641" text-anchor="start" font-size="18" font-weight="650" fill="#19334A">CAPACITY CONTROL  ·  outside the job dependency chain</text><polyline points="295,445 350,445" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="625,445 690,445" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="950,445 1020,445" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="1245,445 1320,445" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="1495,385 1495,265 487,265 487,385" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)"/><polyline points="487,505 487,570 305,570 305,710 350,710" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)" stroke-dasharray="7 6"/><polyline points="625,710 735,710" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)" stroke-dasharray="7 6"/><polyline points="1095,710 1210,710 1210,570 1450,570 1450,505" fill="none" stroke="#315B82" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#navy)" stroke-dasharray="7 6"/><polyline points="1590,505 1590,660" fill="none" stroke="#118C97" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)" marker-start="url(#teal)"/><rect x="55" y="385" width="240" height="120" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="175.0" y="429.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Upload accepted</text><text x="175.0" y="456.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Video + initial jobs</text><text x="175.0" y="480.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">in one DB transaction</text><rect x="350" y="385" width="275" height="120" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="487.5" y="429.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Postgres job state</text><text x="487.5" y="456.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">PipelineJob + chunks</text><text x="487.5" y="480.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Dependencies, leases, retries</text><rect x="690" y="385" width="260" height="120" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="820.0" y="429.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Dispatcher</text><text x="820.0" y="456.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Poll eligible work</text><text x="820.0" y="480.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Recover expired leases</text><rect x="1020" y="385" width="225" height="120" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="1132.5" y="429.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Redis queues</text><text x="1132.5" y="456.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">search / playback</text><text x="1132.5" y="480.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Celery delivery</text><rect x="1320" y="385" width="350" height="120" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="1495.0" y="429.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Task workers</text><text x="1495.0" y="456.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Separate search / playback services</text><text x="1495.0" y="480.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Claim → execute → publish</text><rect x="350" y="660" width="275" height="100" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="487.5" y="706.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Backlog metrics</text><text x="487.5" y="733.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Read durable jobs in Postgres</text><rect x="735" y="660" width="360" height="100" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="915.0" y="706.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">CloudWatch → ECS scaling</text><text x="915.0" y="733.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Wake, grow, return idle pools to zero</text><rect x="1320" y="660" width="350" height="100" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="1495.0" y="694.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Artifact storage</text><text x="1495.0" y="721.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">S3: attempt-specific object keys</text><text x="1495.0" y="745.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Worker disk: temporary files</text><text x="55" y="48" text-anchor="start" font-size="15" font-weight="700" fill="#38B3CD">VINDEX  /  02  ORCHESTRATION</text><text x="55" y="91" text-anchor="start" font-size="34" font-weight="700" fill="#19334A">Durable job state in Postgres; worker capacity in ECS</text><text x="55" y="124" text-anchor="start" font-size="18" font-weight="400" fill="#51687A">Vindex implements the scheduler in durable job rows and a dispatcher, with scaling alongside the task flow.</text><rect x="646.0999999999999" y="231" width="683.8000000000001" height="26" rx="4" fill="white"/><text x="988" y="249" text-anchor="middle" font-size="18" font-weight="400" fill="#51687A">Workers claim, heartbeat and commit with a valid lease + attempt token</text><rect x="633.1" y="415" width="47.8" height="23" rx="4" fill="white"/><text x="657" y="430" text-anchor="middle" font-size="15" font-weight="400" fill="#51687A">Poll</text><rect x="951.175" y="415" width="71.65" height="23" rx="4" fill="white"/><text x="987" y="430" text-anchor="middle" font-size="15" font-weight="400" fill="#51687A">Publish</text><rect x="1245.175" y="415" width="71.65" height="23" rx="4" fill="white"/><text x="1281" y="430" text-anchor="middle" font-size="15" font-weight="400" fill="#51687A">Deliver</text><rect x="348.4" y="541" width="143.2" height="24" rx="4" fill="white"/><text x="420" y="557" text-anchor="middle" font-size="16" font-weight="400" fill="#51687A">Measure backlog</text><rect x="1129.92" y="604" width="160.16" height="24" rx="4" fill="white"/><text x="1210" y="620" text-anchor="middle" font-size="16" font-weight="400" fill="#51687A">Change task count</text><rect x="1527.94" y="575" width="124.12" height="25" rx="4" fill="white"/><text x="1590" y="592" text-anchor="middle" font-size="17" font-weight="400" fill="#118C97">Read / write</text><text x="55" y="835" text-anchor="start" font-size="19" font-weight="650" fill="#19334A">Recovery:</text><text x="160" y="835" text-anchor="start" font-size="19" font-weight="400" fill="#51687A">Unclaimed jobs can be delivered again; stale attempts cannot publish authoritative results.</text><path d="M55 885 H1745" stroke="#D7E6EC"/><text x="55" y="913" text-anchor="start" font-size="17" font-weight="400" fill="#51687A">The current state tier consolidates Postgres, Redis, Qdrant, dispatcher, maintenance and metrics on one EC2 host.</text><text x="55" y="938" text-anchor="start" font-size="17" font-weight="400" fill="#51687A">There is no separate generic DAG engine, completion queue, or inline resource-manager service in this path.</text></g></svg>
