" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="175.0" y="226.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">User / browser</text><text x="175.0" y="253.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">React app</text><rect x="365" y="180" width="260" height="100" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="495.0" y="226.0" text-anchor="middle" font-size="20" font-weight="650" fill="#19334A">CloudFront + API GW</text><text x="495.0" y="253.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">UI delivery + API routing</text><rect x="710" y="180" width="280" height="100" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="850.0" y="226.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">FastAPI on Fargate</text><text x="850.0" y="253.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Authorize • intent • complete</text><rect x="1120" y="180" width="360" height="100" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="1300.0" y="226.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Postgres</text><text x="1300.0" y="253.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Video + reservation + two jobs</text><rect x="60" y="340" width="230" height="80" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="175.0" y="376.0" text-anchor="middle" font-size="21" font-weight="650" fill="#19334A">Cognito</text><text x="175.0" y="403.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Sign-in and JWTs</text><rect x="365" y="340" width="260" height="80" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="495.0" y="376.0" text-anchor="middle" font-size="21" font-weight="650" fill="#19334A">Frontend S3 bucket</text><text x="495.0" y="403.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">React assets</text><rect x="95" y="555" width="175" height="100" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="182.5" y="601.0" text-anchor="middle" font-size="21" font-weight="650" fill="#19334A">Upload key</text><text x="182.5" y="628.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Browser-writable</text><rect x="300" y="555" width="180" height="100" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="390.0" y="601.0" text-anchor="middle" font-size="21" font-weight="650" fill="#19334A">Accepted raw</text><text x="390.0" y="628.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Server-only copy</text><rect x="95" y="710" width="385" height="90" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="287.5" y="751.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Published artifacts</text><text x="287.5" y="778.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">MP4 • thumbnail • audio • transcript</text><rect x="1120" y="410" width="360" height="95" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="1300.0" y="453.5" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Durable-job dispatcher</text><text x="1300.0" y="480.5" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Poll + recover + publish</text><rect x="1120" y="580" width="360" height="90" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="1300.0" y="621.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Redis / Celery</text><text x="1300.0" y="648.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Transport for task messages</text><rect x="685" y="615" width="280" height="70" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="825.0" y="646.0" text-anchor="middle" font-size="21" font-weight="650" fill="#19334A">Search workers</text><text x="825.0" y="673.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Whisper + embeddings</text><rect x="685" y="710" width="280" height="70" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="825.0" y="741.0" text-anchor="middle" font-size="21" font-weight="650" fill="#19334A">Playback workers</text><text x="825.0" y="768.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">FFmpeg + thumbnail</text><rect x="1120" y="790" width="360" height="90" rx="12" fill="white" stroke="#38B3CD" stroke-width="2.2"/><text x="1300.0" y="831.0" text-anchor="middle" font-size="22" font-weight="650" fill="#19334A">Qdrant</text><text x="1300.0" y="858.0" text-anchor="middle" font-size="17" font-weight="400" fill="#51687A">Timestamped segment vectors</text><text x="55" y="48" text-anchor="start" font-size="15" font-weight="700" fill="#38B3CD">VINDEX  /  01  SYSTEM FLOW</text><text x="55" y="91" text-anchor="start" font-size="34" font-weight="700" fill="#19334A">Upload directly to S3; coordinate through the API</text><text x="55" y="124" text-anchor="start" font-size="18" font-weight="400" fill="#51687A">Current core path: same media bucket, durable jobs, separate search and playback worker pools.</text><rect x="351.32" y="147" width="287.36" height="24" rx="4" fill="white"/><text x="495" y="163" text-anchor="middle" font-size="16" font-weight="400" fill="#51687A">1. intent / 3. complete / status</text><rect x="995.325" y="200" width="119.35000000000001" height="23" rx="4" fill="white"/><text x="1055" y="215" text-anchor="middle" font-size="15" font-weight="400" fill="#51687A">Atomic commit</text><rect x="55.89999999999999" y="455" width="196.20000000000002" height="25" rx="4" fill="white"/><text x="154" y="472" text-anchor="middle" font-size="17" font-weight="400" fill="#118C97">2. direct video POST</text><rect x="568.88" y="427" width="232.24" height="25" rx="4" fill="white"/><text x="685" y="444" text-anchor="middle" font-size="17" font-weight="400" fill="#118C97">3. freeze + verify input</text><rect x="1198.72" y="349" width="202.56" height="24" rx="4" fill="white"/><text x="1300" y="365" text-anchor="middle" font-size="16" font-weight="400" fill="#51687A">4. poll committed work</text><rect x="1211.44" y="535" width="177.12" height="24" rx="4" fill="white"/><text x="1300" y="551" text-anchor="middle" font-size="16" font-weight="400" fill="#51687A">5. publish task IDs</text><rect x="532.2" y="675" width="79.6" height="23" rx="4" fill="white"/><text x="572" y="690" text-anchor="middle" font-size="15" font-weight="400" fill="#118C97">Read raw</text><rect x="500.90999999999997" y="876" width="178.18" height="25" rx="4" fill="white"/><text x="590" y="893" text-anchor="middle" font-size="17" font-weight="400" fill="#118C97">6. publish outputs</text><rect x="1122.08" y="305" width="295.84000000000003" height="24" rx="4" fill="white"/><text x="1270" y="321" text-anchor="middle" font-size="16" font-weight="400" fill="#51687A">Commit status + artifact pointers</text><text x="60" y="935" text-anchor="start" font-size="18" font-weight="650" fill="#19334A">Read path</text><text x="166" y="935" text-anchor="start" font-size="18" font-weight="400" fill="#51687A">API authorizes playback → browser uses a signed S3 GET. Semantic queries go through API → Qdrant.</text><path d="M55 965 H1545" stroke="#D7E6EC"/><text x="55" y="993" text-anchor="start" font-size="17" font-weight="400" fill="#51687A">Blue = control / state. Teal = media / artifacts. VPC link + Cloud Map connect API Gateway to API tasks.</text><text x="55" y="1018" text-anchor="start" font-size="17" font-weight="400" fill="#51687A">CloudFront currently fronts the app and API; the media bucket is not configured as a CloudFront origin.</text></g></svg>
