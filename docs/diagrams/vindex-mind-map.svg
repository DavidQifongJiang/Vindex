<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1034" viewBox="0 0 1320 1034" role="img" aria-labelledby="title description">
<title id="title">Vindex project mind map</title>
<desc id="description">Six branches describe product experience, media processing, search and retrieval, reliable jobs, optional analytics, and delivery and operations. Library search requires feature configuration. Kafka analytics is a prototype. Branches group responsibilities and do not indicate execution order.</desc>
<metadata>Sources: README.md; docs/system_design.md; docs/production_operations.md; frontend/src/auth.ts; app/services/video_service.py. Working-tree overview, 2026-10-26. Labels are editable SVG text.</metadata>
