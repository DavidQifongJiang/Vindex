name: Practice CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get this revision of the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run the same checks as on your laptop
        run: |
          python -m compileall -q app.py scripts tests
          python -m unittest discover -s tests -v
