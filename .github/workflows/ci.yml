name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  kafka-integration:
    name: Optional Kafka integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
          python -m pip install -r requirements.txt -r requirements-analytics.txt
      - name: Start isolated analytics services
        run: docker compose -p vindex-analytics -f docker-compose.analytics.yml up -d --wait
      - name: Test real commit, crash and replay paths
        env:
          VINDEX_TEST_DATABASE_URL: postgresql+psycopg2://analytics:local_analytics_only@127.0.0.1:15434/analytics
          VINDEX_TEST_KAFKA_BOOTSTRAP: 127.0.0.1:19092
        run: python -m unittest tests.test_search_events tests.test_search_event_worker tests.test_search_events_integration tests.test_search_events_rebalance -v
      - name: Capture service logs
        if: failure()
        run: docker compose -p vindex-analytics -f docker-compose.analytics.yml logs --no-color
      - name: Stop isolated services
        if: always()
        run: docker compose -p vindex-analytics -f docker-compose.analytics.yml down -v
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vindex_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      VINDEX_TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/vindex_test
      VINDEX_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
          python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall app alembic

      - name: Run backend unit tests
        run: python -m unittest discover -s tests

      - name: Verify real backup and restore with mocked S3
        env:
          DATABASE_URL: ${{ env.VINDEX_TEST_DATABASE_URL }}
        run: |
          python -m alembic upgrade head
          docker build -f ops/Dockerfile.backup -t vindex-backup-test .
          docker run --rm --network host -e PGHOST=127.0.0.1 -e PGDATABASE=vindex_test -e PGUSER=postgres -e PGPASSWORD=test --mount "type=bind,source=$PWD,target=/workspace,readonly" --entrypoint python3 vindex-backup-test /workspace/tests/backup_restore_smoke.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Docker Compose config
        run: docker compose --env-file .env.example config --quiet
