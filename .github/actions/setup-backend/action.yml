name: Set up backend
description: Install Python 3.11 and the CPU-only backend dependencies.
inputs:
  analytics:
    description: Also install the optional Kafka client.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements*.txt
    - name: Install backend dependencies
      shell: bash
      working-directory: backend
      env:
        ANALYTICS: ${{ inputs.analytics }}
      run: |
        python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
        python -m pip install -r requirements.txt
        if [ "$ANALYTICS" = "true" ]; then python -m pip install -r requirements-analytics.txt; fi
